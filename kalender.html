<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amelie</title>

    <style>
        body {
            background: #202124;
            justify-items: center;
            font-family:Arial, Helvetica, sans-serif;
        }
      .calendar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 750px;
            margin: 30px auto;
            padding: 20px;

            background: #681E36;
            color: #F3E8E6;
            width: 100%;
        }

        @media (max-width: 550px) {
            .calendar {
                grid-template-columns: repeat(3, 1fr);
            }

            .door {
                height: 100px;
                font-size: 26px;
            }
        }
        .door {
            display: flex;
            justify-content: center;
            align-items: center;
        
            height: 100px;
            background: #D6AD70;
            color: #202124;
        
            border: 2px solid #202124;
            border-radius: 10px;
        
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        
            transition: 0.2s;
      }

        .door.locked {
            background: #444;
            color: #888;
            opacity: 0.5;
            pointer-events: none;
        }
        .bild {
            background: #681E36;
            color: #F3E8E6;
            width: 100%;
            text-align: center;
            padding-bottom: 20px;
            padding-top: 20px;
        }
        .link {
            background: #D6AD70;
            padding: 10px;
            border: 2px solid #202124;
            border-radius: 10px;
            margin-top: 100px;
        }
        .button {
            margin-top: 40px;
            background: #681E36;
            color: #F3E8E6;
            padding: 15px 40px;
            border: 2px solid #D6AD70;
            border-radius: 10px;
            text-align: center;
            display:flex
            
        }
        h1 {
            color: #D6AD70;
            
        }
        h2 {
            color: #D6AD70;
        }
        a {
            color: #202124;
        }
        img {
            height: 100px;
            width: auto;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>Adventskalender</h1>
    <div class="calendar" >

            <a href="tage/1.html" class="door">1</a>
            <a href="tage/2.html" class="door">2</a>
            <a href="tage/3.html" class="door">3</a>
            <a href="tage/4.html" class="door">4</a>
            <a href="tage/5.html" class="door">5</a>
            <a href="tage/6.html" class="door">6</a>
            <a href="tage/7.html" class="door">7</a>
            <a href="tage/8.html" class="door">8</a>
            <a href="tage/9.html" class="door">9</a>
            <a href="tage/10.html" class="door">10</a>
            <a href="tage/11.html" class="door">11</a>
            <a href="tage/12.html" class="door">12</a>
            <a href="tage/13.html" class="door">13</a>
            <a href="tage/14.html" class="door">14</a>
            <a href="tage/15.html" class="door">15</a>
            <a href="tage/16.html" class="door">16</a>
            <a href="tage/17.html" class="door">17</a>
            <a href="tage/18.html" class="door">18</a>
            <a href="tage/19.html" class="door">19</a>
            <a href="tage/20.html" class="door">20</a>
            <a href="tage/21.html" class="door">21</a>
            <a href="tage/22.html" class="door">22</a>
            <a href="tage/23.html" class="door">23</a>
            <a href="tage/24.html" class="door">24</a>

        </div>
    <div class="link">
        <a href="index.html" >Zurück</a>
    </div>    
    <script>
        const heute = new Date();

        const monat = heute.getMonth(); // Dezember = 11
        const tag = heute.getDate();

        const aktuellerTag = monat === 11 ? tag : 0;

        document.querySelectorAll(".door").forEach(tuer => {
            const nummer = parseInt(tuer.textContent);

            if (nummer > aktuellerTag) {
                tuer.classList.add("locked");
                tuer.removeAttribute("href");
            }
        });
    </script>

</body>
</html>
